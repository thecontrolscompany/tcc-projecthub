<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — TCC ProjectHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 2rem;
      opacity: 0.85;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(1,122,111,0.15);
      border: 1px solid rgba(1,122,111,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }
    p {
      font-size: 0.9375rem;
      color: #94a3b8;
      max-width: 36ch;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: rgba(1,122,111,0.2);
      border: 1px solid rgba(1,122,111,0.4);
      color: #2dd4bf;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: rgba(1,122,111,0.35); }
    .note {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="TCC ProjectHub" class="logo" onerror="this.style.display='none'" />
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="1.75">
      <path d="M1 6l5 5 5-5M1 18l5-5 5 5M13 6l5 5 5-5M13 18l5-5 5 5"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Previously loaded project data is still available. Open the app and navigate to your projects.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <p class="note">Changes made offline will sync automatically when signal returns.</p>
</body>
</html>
